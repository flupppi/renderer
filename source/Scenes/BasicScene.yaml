objects:
  - name: "Ground"
    type: sphere
    position: [0.0, -100.5, -1.0]
    radius: 100.0
    material: diffuse_grey

  - name: "Ball1"
    type: sphere
    position: [0.0, 0.0, -1.0]
    radius: 0.5
    material: green_diffuse

  - name: "Ball2"
    type: sphere
    position: [2.0, 0.0, -1.0]
    radius: 0.5
    material: shiny_metal

  - name: "Ball3"
    type: sphere
    position: [ -2.0, 0.0, -1.0 ]
    radius: 0.3
    material: green_diffuse

  - name: "Ball4"
    type: sphere
    position: [ 1.0, 0.0, -30.0 ]
    radius: 20.0
    material: glassy


materials:
  - name: shiny_metal
    type: metal
    albedo: [0.5, 0.8, 0.8]
    fuzz: 0.05

  - name: green_diffuse
    type: diffuse
    albedo: [0.2, 0.5, 0.2]
  - name: diffuse_grey
    type: diffuse
    albedo: [0.8, 0.8, 0.8]
  - name: glassy
    type: glass
    ref_idx: 1.5

camera:
  mode: "FPS"               # or "Orbit"
  position: [0.0, 1.5, 5.0]
  yaw: -90.0
  pitch: 0.0
  fov: 45.0
  speed: 2.5
  orbit_distance: 10.0
  orbit_angle: 0.0
