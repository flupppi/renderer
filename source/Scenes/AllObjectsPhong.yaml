materials:
  - name: white
    type: blinn_phong
    ambient:  [0.1, 0.1, 0.1]
    diffuse:  [0.73, 0.73, 0.73]
    specular: [0.3, 0.3, 0.3]
    shininess: 16


  - name: red
    type: blinn_phong
    ambient:  [0.1, 0.02, 0.02]
    diffuse:  [0.65, 0.05, 0.05]
    specular: [0.2, 0.2, 0.2]
    shininess: 8

  - name: green
    type: blinn_phong
    ambient:  [0.05, 0.1, 0.05]
    diffuse:  [0.12, 0.45, 0.15]
    specular: [0.2, 0.2, 0.2]
    shininess: 8

  - name: shiny_metal
    type: blinn_phong
    ambient:  [0.1, 0.1, 0.1]
    diffuse:  [0.7, 0.6, 0.5]
    specular: [0.9, 0.9, 0.9]
    shininess: 64
    reflectivity: 1.0

  - name: green_diffuse
    type: blinn_phong
    ambient:  [0.05, 0.1, 0.05]
    diffuse:  [0.2, 0.5, 0.2]
    specular: [0.1, 0.1, 0.1]
    shininess: 8

  - name: shiny
    type: blinn_phong
    ambient: [ 0.1, 0.1, 0.1 ]
    diffuse: [ 0.2, 0.2, 0.2 ]
    specular: [ 0.8, 0.8, 0.8 ]
    shininess: 64
    reflectivity: 0.5


objects:
  # Walls
  - name: left_wall
    type: cube
    material: red
    transform:
      translate: [-1.51, 1.0, 0.0]
      scale: [0.02, 2.0, 3.0]

  - name: right_wall
    type: cube
    material: green
    transform:
      translate: [1.51, 1.0, 0.0]
      scale: [0.02, 2.0, 3.0]

  - name: back_wall
    type: cube
    material: white
    transform:
      translate: [0.0, 1.0, -1.51]
      scale: [3.0, 2.0, 0.02]

  - name: floor
    type: cube
    material: white
    transform:
      translate: [0.0, -0.01, 0.0]
      scale: [3.0, 0.02, 3.0]

  # Base boxes
  - name: short_box
    type: cube
    material: green_diffuse
    transform:
      translate: [-0.9, 0.25, -0.8]
      scale: [0.4, 0.5, 0.4]
      rotate: [0, -15, 0]

  - name: tall_box
    type: cube
    material: shiny
    transform:
      translate: [0.9, 0.75, 0.8]
      scale: [0.4, 1.5, 0.4]
      rotate: [0, 15, 0]

  # Primitives
  - name: sphere
    type: sphere
    material: shiny_metal
    position: [0.0, 0.35, -0.5]
    radius: 0.35

  - name: uvsphere
    type: uvsphere
    material: green
    slices: 16
    stacks: 12
    transform:
      translate: [-0.5, 0.3, 0.6]
      scale: [0.3, 0.3, 0.3]

  - name: cone
    type: cone
    material: red
    resolution: 20
    radius: 0.2
    height: 0.6
    transform:
      translate: [0.5, 0.3, -0.6]

  - name: triangle
    type: triangle
    material: shiny_metal
    a: [0.0, 0.0, 0.0]
    b: [0.5, 0.0, 0.0]
    c: [0.25, 0.5, 0.0]
    transform:
      translate: [-0.8, 0.3, 0.4]

  - name: quad
    type: quad
    material: green_diffuse
    a: [-0.3, 0.0, 0.3]
    b: [0.3, 0.0, 0.3]
    c: [0.3, 0.6, 0.3]
    d: [-0.3, 0.6, 0.3]
    transform:
      translate: [0.6, 0.3, 0.4]



camera:
  mode: "FPS"
  position: [0.0, 1.0, 4.0]
  yaw: -90.0
  pitch: 0.0
  fov: 40.0
  speed: 2.5
  orbit_distance: 10.0
  orbit_angle: 0.0