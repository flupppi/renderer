materials:
  - name: white
    type: diffuse
    albedo: [0.73, 0.73, 0.73]
  - name: red
    type: diffuse
    albedo: [0.65, 0.05, 0.05]
  - name: green
    type: diffuse
    albedo: [0.12, 0.45, 0.15]
  - name: shiny_metal
    type: metal
    albedo: [0.7, 0.6, 0.5]
    fuzz: 0.00
  - name: fuzzy_metal
    type: metal
    albedo: [0.6, 0.2, 0.8]
    fuzz: 0.05
  - name: green_diffuse
    type: diffuse
    albedo: [0.2, 0.5, 0.2]
  - name: glass
    type: glass
    ref_idx: 1.5
  - name: water
    type: glass
    ref_idx: 2.5
  - name: light_emissive
    type: emissive
    emit: [ 4.0, 4.0, 4.0 ]
  - name: low_emissive
    type: emissive
    emit: [ 1.4, 1.4, 1.4 ]
  - name: floor_checker
    type: diffuse
    texture:
      checker:
        scale: 0.5
        even: [ 0.8, 0.8, 0.8 ]
        odd: [ 0.2, 0.3, 0.5 ]

  - name: ball_checker
    type: diffuse
    texture:
      checker:
        scale: 0.1
        even: [ 0.8, 0.3, 0.3 ]
        odd: [ 0.2, 0.9, 0.9 ]



objects:
  # Right wall (green)
  - name: right_wall
    type: quad
    material: green
    a: [1.5, 0.0, -1.5]
    b: [1.5, 0.0,  1.5]
    c: [1.5, 2.0,  1.5]
    d: [1.5, 2.0, -1.5]

  # Left wall (red)
  - name: Left_wall
    type: quad
    material: red
    a: [-1.5, 0.0,  1.5]
    b: [-1.5, 0.0, -1.5]
    c: [-1.5, 2.0, -1.5]
    d: [-1.5, 2.0,  1.5]

  # Back wall (white)
  - name: back_wall
    type: quad
    material: white
    a: [-1.5, 0.0, -1.5]
    b: [ 1.5, 0.0, -1.5]
    c: [ 1.5, 2.0, -1.5]
    d: [-1.5, 2.0, -1.5]

  # Floor (white)
  - name: floor
    type: quad
    material: floor_checker
    a: [-1.5, 0.0,  1.5]
    b: [ 1.5, 0.0,  1.5]
    c: [ 1.5, 0.0, -1.5]
    d: [-1.5, 0.0, -1.5]

  # Ceiling (white)
  - name: ceiling
    type: quad
    material: white
    a: [-1.5, 2.0, -1.5]
    b: [ 1.5, 2.0, -1.5]
    c: [ 1.5, 2.0,  1.5]
    d: [-1.5, 2.0,  1.5]

  # Emissive light panel (thin square at center of ceiling)
  - name: ceiling_light
    type: quad
    material: light_emissive
    a: [-0.5, 1.99, -0.5]
    b: [ 0.5, 1.99, -0.5]
    c: [ 0.5, 1.99,  0.5]
    d: [-0.5, 1.99,  0.5]
  # Dim light triangle on left wall
  - name: wall_light_triangle
    type: triangle
    material: water
    a: [-1.3, 1.2,  0.3]
    b: [-1.0, 1.0,  0.7]
    c: [-1.0, 1.4,  0.6]
    transform:
      translate: [0.25, 0.25, -1.4]




  # Box 2 (tall, shiny metal)
  - name: tall_box
    type: cube
    material: fuzzy_metal
    transform:
      translate: [1.0, 0.6, 0.8]
      scale: [0.4, 1.2, 0.5]
      rotate: [0, 15, 0]

  # Sphere (center, metal)
  - name: glass_sphere
    type: sphere
    material: glass
    position: [ 0.0, 0.4, 0.8 ]
    radius: 0.4
  # Glass sphere (floating)
  - name: checker_sphere
    type: sphere
    material: ball_checker
    position: [0.6, 1.3, -0.3]
    radius: 0.2


  # Mirror metal sphere near wall
  - name: metal_sphere
    type: sphere
    material: shiny_metal
    position: [0.9, 0.3, -0.6]
    radius: 0.3

  # Checker-textured UV sphere
  - name: metal_uvsphere
    type: uvsphere
    material: shiny_metal
    transform:
      translate: [-0.7, 0.6, 1.6]
      scale: [0.1, 0.1, 0.1]
      rotate: [0, -30, -25]
    slices: 6
    stacks: 5

  # Box 1 (short, green diffuse)
  - name: short_box
    type: cube
    material: green_diffuse
    transform:
      translate: [-0.8, 0.5, -0.8]
      scale: [0.6, 1.0, 0.6]
      rotate: [0, -18, 0]


  # Small cube under light to receive direct light
  - name: light_receiver_cube
    type: cube
    material: white
    transform:
      translate: [0.5, 1.6, 0]
      scale: [0.3, 0.2, 0.3]
      rotate: [30, -20, 1]

  # Cone for geometric variety
  - name: small_cone
    type: cone
    material: green_diffuse
    resolution: 7
    radius: 0.2
    height: 0.6
    transform:
      translate: [-1, 1.5, 0.8]
      rotate: [45, 0, -60]



camera:
  mode: "FPS"
  position: [0.0, 1.0, 4.0]
  yaw: -90.0
  pitch: 0.0
  fov: 40.0
  speed: 2.5
  orbit_distance: 10.0
  orbit_angle: 0.0
